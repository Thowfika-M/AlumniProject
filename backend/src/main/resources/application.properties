# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Info
spring.application.name=AlumniConnect API

# Spring Profiles (default: dev using H2; use 'mysql' profile for MySQL Database)
spring.profiles.active=dev

# JPA / Hibernate Base Config
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/resumes

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# AI Configuration
app.ai.provider=mock
app.ai.api-key=demo-key
app.ai.model=gpt-3.5-turbo

# Default Dev Profile (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:alumniconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
