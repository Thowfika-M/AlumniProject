# application-test.properties
# In-Memory H2 Configuration for Automated Test Suite Execution

spring.datasource.url=jdbc:h2:mem:alumnidb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during tests so JPA ddl-auto creates test schema dynamically
spring.flyway.enabled=false

# Security & JWT Test Properties
jwt.secret=9a4f2c8d7e1b3a6c5e8f0d2b4a6c9e1f3a5b7c8d0e2f4a6b8c0d2e4f6a8b0c2d
jwt.expiration-ms=86400000

# AI Provider Test Config
openai.api.key=
